name: VibeTV
options:
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  VibeTV:
    type: application
    platform: tvOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VibeTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vibe TV
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets:
        - VibeTVTests
  VibeTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - Tests
    dependencies:
      - target: VibeTV

